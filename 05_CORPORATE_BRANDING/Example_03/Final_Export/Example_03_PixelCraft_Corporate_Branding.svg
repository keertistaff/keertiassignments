<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="agencyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#F97316"/>
  </linearGradient>
</defs>

<rect width="800" height="600" fill="#F4F4F5"/>
<text x="400" y="45" font-family="'Arial Black', sans-serif" font-size="20" fill="#18181B" text-anchor="middle">PIXELCRAFT STUDIO - BRAND IDENTITY SYSTEM</text>

<!-- Letterhead (Left) -->
<g transform="translate(60, 80)">
  <rect x="0" y="0" width="300" height="420" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
  <rect x="0" y="0" width="300" height="8" fill="url(#agencyGrad)"/>

  <!-- Logo -->
  <g transform="translate(30, 36)">
    <!-- Isometric Cube -->
    <polygon points="12,0 24,7 12,14 0,7" fill="#F97316"/>
    <polygon points="0,7 12,14 12,28 0,21" fill="#7C3AED"/>
    <polygon points="24,7 24,21 12,28 12,14" fill="#C2410C"/>
    <text x="36" y="16" font-family="'Arial Black', sans-serif" font-size="14" fill="#18181B">PIXELCRAFT</text>
    <text x="36" y="27" font-family="'Arial', sans-serif" font-weight="bold" font-size="8" letter-spacing="2" fill="#7C3AED">STUDIO</text>
  </g>

  <!-- Body -->
  <g transform="translate(30, 100)" fill="#71717A">
    <rect x="0" y="20" width="240" height="5" rx="2"/><rect x="0" y="32" width="240" height="5" rx="2"/>
    <rect x="0" y="44" width="190" height="5" rx="2"/>
    <rect x="0" y="66" width="240" height="5" rx="2"/><rect x="0" y="78" width="240" height="5" rx="2"/>
    <rect x="0" y="90" width="210" height="5" rx="2"/>
  </g>
  <!-- Footer -->
  <line x1="30" y1="390" x2="270" y2="390" stroke="#E4E4E7" stroke-width="1"/>
  <text x="150" y="405" font-family="'Arial', sans-serif" font-size="7" fill="#71717A" text-anchor="middle">hello@pixelcraft.studio • www.pixelcraft.studio • Brooklyn, NY</text>
</g>

<!-- Envelope -->
<g transform="translate(400, 80)">
  <rect x="0" y="0" width="340" height="160" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
  <rect x="0" y="0" width="340" height="6" fill="url(#agencyGrad)"/>
  <text x="30" y="36" font-family="'Arial Black', sans-serif" font-size="12" fill="#18181B">PIXELCRAFT STUDIO</text>
  <text x="140" y="95" font-family="'Arial', sans-serif" font-size="9" fill="#52525B">
    <tspan x="140" dy="0">Art Basel Miami</tspan>
    <tspan x="140" dy="16">1901 Convention Center Dr</tspan>
    <tspan x="140" dy="16">Miami Beach, FL 33139</tspan>
  </text>
</g>

<!-- Business Card -->
<g transform="translate(400, 275)">
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="160" height="92" rx="4" fill="#18181B"/>
    <polygon points="12,0 24,7 12,14 0,7" fill="#F97316" transform="translate(20, 25)"/>
    <polygon points="0,7 12,14 12,28 0,21" fill="#7C3AED" transform="translate(20, 25)"/>
    <polygon points="24,7 24,21 12,28 12,14" fill="#C2410C" transform="translate(20, 25)"/>
    <text x="56" y="38" font-family="'Arial Black', sans-serif" font-size="10" fill="#FFFFFF">PIXELCRAFT</text>
    <text x="56" y="48" font-family="'Arial', sans-serif" font-size="6" font-weight="bold" letter-spacing="1" fill="#F97316">CREATIVE DIR</text>
    <text x="20" y="76" font-family="'Arial', sans-serif" font-size="6" fill="#A1A1AA">maya@pixelcraft.studio</text>
  </g>
  <g transform="translate(180, 0)">
    <rect x="0" y="0" width="160" height="92" rx="4" fill="url(#agencyGrad)"/>
    <text x="80" y="48" font-family="'Arial Black', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">MAKE BOLD WORK.</text>
    <text x="80" y="62" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PIXELCRAFT.STUDIO</text>
  </g>
</g>
</svg>
