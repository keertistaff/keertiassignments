<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
<defs>
  <radialGradient id="aiGlow" cx="50%" cy="20%" r="70%">
    <stop offset="0%" stop-color="#1E1B4B"/>
    <stop offset="50%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#030712"/>
  </radialGradient>
  <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
</defs>

<rect width="595" height="842" fill="url(#aiGlow)"/>

<!-- Neural Network Constellation -->
<g stroke="#00D4FF" stroke-width="1" opacity="0.2" fill="none">
  <line x1="60" y1="120" x2="180" y2="80"/>
  <line x1="180" y1="80" x2="300" y2="130"/>
  <line x1="300" y1="130" x2="420" y2="70"/>
  <line x1="420" y1="70" x2="530" y2="120"/>
  <circle cx="180" cy="80" r="4" fill="#00D4FF"/>
  <circle cx="300" cy="130" r="6" fill="#8B5CF6"/>
  <circle cx="420" cy="70" r="4" fill="#00D4FF"/>
</g>

<!-- Header -->
<g transform="translate(45, 50)">
  <rect x="0" y="0" width="160" height="22" rx="11" fill="#1E1B4B" stroke="#00D4FF" stroke-width="1"/>
  <text x="80" y="15" fill="#00D4FF" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" letter-spacing="2" text-anchor="middle">GLOBAL TECH MONITOR</text>
  <text x="0" y="58" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="28" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text>
  <text x="0" y="86" fill="url(#cyanPurple)" font-family="'Arial Black', sans-serif" font-size="22" letter-spacing="2">IN EVERYDAY ECOSYSTEMS</text>
  <text x="0" y="110" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="12">How generative and predictive AI are transforming core human sectors by 2030.</text>
</g>

<!-- 4 Sector Grid -->
<g transform="translate(45, 190)">
  <!-- 1: Healthcare -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="240" height="230" rx="16" fill="#0F172A" stroke="#00D4FF" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="24" fill="#083344" stroke="#00D4FF" stroke-width="2"/>
    <text x="45" y="52" fill="#00D4FF" font-family="'Arial Black', sans-serif" font-size="16" text-anchor="middle">+</text>
    <text x="82" y="40" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="16">HEALTHCARE</text>
    <text x="82" y="56" fill="#38BDF8" font-family="'Arial', sans-serif" font-size="11">Predictive Diagnostics</text>
    <text x="18" y="100" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11" width="200">
      <tspan x="18" dy="0">- Early tumor &amp; anomaly detection</tspan>
      <tspan x="18" dy="18">- Genomic medicine modeling</tspan>
      <tspan x="18" dy="18">- Automated robotic surgery</tspan>
    </text>
    <rect x="18" y="170" width="204" height="42" rx="8" fill="#030712"/>
    <text x="30" y="196" fill="#00D4FF" font-family="'Arial Black', sans-serif" font-size="18">89%</text>
    <text x="80" y="195" fill="#64748B" font-family="'Arial', sans-serif" font-size="10">Diagnostic Speed Surge</text>
  </g>

  <!-- 2: Education -->
  <g transform="translate(265, 0)">
    <rect x="0" y="0" width="240" height="230" rx="16" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="24" fill="#2E1065" stroke="#8B5CF6" stroke-width="2"/>
    <text x="45" y="52" fill="#A78BFA" font-family="'Arial Black', sans-serif" font-size="15" text-anchor="middle">AI</text>
    <text x="82" y="40" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="16">EDUCATION</text>
    <text x="82" y="56" fill="#C084FC" font-family="'Arial', sans-serif" font-size="11">Adaptive Curriculums</text>
    <text x="18" y="100" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11">
      <tspan x="18" dy="0">- 1-on-1 personalized tutoring</tspan>
      <tspan x="18" dy="18">- Instant multilingual translation</tspan>
      <tspan x="18" dy="18">- Automated assignment scoring</tspan>
    </text>
    <rect x="18" y="170" width="204" height="42" rx="8" fill="#030712"/>
    <text x="30" y="196" fill="#C084FC" font-family="'Arial Black', sans-serif" font-size="18">4.2x</text>
    <text x="80" y="195" fill="#64748B" font-family="'Arial', sans-serif" font-size="10">Student Retention Rate</text>
  </g>

  <!-- 3: Business -->
  <g transform="translate(0, 255)">
    <rect x="0" y="0" width="240" height="230" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="24" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="45" y="52" fill="#34D399" font-family="'Arial Black', sans-serif" font-size="15" text-anchor="middle">OP</text>
    <text x="82" y="40" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="16">ENTERPRISE</text>
    <text x="82" y="56" fill="#34D399" font-family="'Arial', sans-serif" font-size="11">Operations &amp; Log</text>
    <text x="18" y="100" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11">
      <tspan x="18" dy="0">- Autonomous supply chain routing</tspan>
      <tspan x="18" dy="18">- Intelligent agent customer CRM</tspan>
      <tspan x="18" dy="18">- Predictive demand forecasting</tspan>
    </text>
    <rect x="18" y="170" width="204" height="42" rx="8" fill="#030712"/>
    <text x="30" y="196" fill="#34D399" font-family="'Arial Black', sans-serif" font-size="18">64%</text>
    <text x="80" y="195" fill="#64748B" font-family="'Arial', sans-serif" font-size="10">Operational Cost Saved</text>
  </g>

  <!-- 4: Finance -->
  <g transform="translate(265, 255)">
    <rect x="0" y="0" width="240" height="230" rx="16" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="24" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
    <text x="45" y="52" fill="#FBBF24" font-family="'Arial Black', sans-serif" font-size="15" text-anchor="middle">$</text>
    <text x="82" y="40" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="16">FINANCE</text>
    <text x="82" y="56" fill="#FBBF24" font-family="'Arial', sans-serif" font-size="11">Automated Security</text>
    <text x="18" y="100" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11">
      <tspan x="18" dy="0">- Microsecond fraud detection</tspan>
      <tspan x="18" dy="18">- Algorithmic high-frequency trades</tspan>
      <tspan x="18" dy="18">- Automated risk underwriting</tspan>
    </text>
    <rect x="18" y="170" width="204" height="42" rx="8" fill="#030712"/>
    <text x="30" y="196" fill="#FBBF24" font-family="'Arial Black', sans-serif" font-size="18">0.02s</text>
    <text x="80" y="195" fill="#64748B" font-family="'Arial', sans-serif" font-size="10">Fraud Intercept Latency</text>
  </g>
</g>

<!-- Footer Stat Matrix -->
<g transform="translate(45, 700)">
  <rect x="0" y="0" width="505" height="90" rx="16" fill="#090D1A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="25" y="32" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="14">ESTIMATED GLOBAL MARKET VALUE (2030)</text>
  <text x="25" y="66" fill="#00D4FF" font-family="'Arial Black', sans-serif" font-size="28">$1,339 BILLION</text>
  <text x="320" y="42" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11">Compound Annual Growth Rate</text>
  <text x="320" y="66" fill="#10B981" font-family="'Arial Black', sans-serif" font-size="20">CAGR +37.3%</text>
</g>
</svg>
