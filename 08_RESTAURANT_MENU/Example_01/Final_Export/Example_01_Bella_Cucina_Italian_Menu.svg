<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
<defs>
  <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFDF9"/>
    <stop offset="100%" stop-color="#FBF7EE"/>
  </linearGradient>
</defs>

<rect width="595" height="842" fill="url(#parchment)"/>

<!-- Elegant Double Border -->
<rect x="25" y="25" width="545" height="792" fill="none" stroke="#991B1B" stroke-width="1.5"/>
<rect x="31" y="31" width="533" height="780" fill="none" stroke="#4D7C0F" stroke-width="0.75" stroke-dasharray="6 3"/>

<!-- Header -->
<g transform="translate(297, 68)" text-anchor="middle">
  <path d="M-30,-15 C-15,-20 0,-10 0,0 C0,-10 15,-20 30,-15" fill="none" stroke="#4D7C0F" stroke-width="1.5"/>
  <text x="0" y="24" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="34" letter-spacing="3" fill="#1C1917">BELLA CUCINA</text>
  <text x="0" y="44" font-family="'Times New Roman', serif" font-style="italic" font-size="13" letter-spacing="4" fill="#991B1B">TRATTORIA &amp; PIZZERIA TRADIZIONALE</text>
</g>

