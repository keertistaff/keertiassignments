  <!-- Item 1 -->
  <text x="0" y="42" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Bruschetta al Pomodoro e Basilico</text>
  <text x="475" y="42" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$14.50</text>
  <text x="0" y="56" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Toasted sourdough, heirloom tomatoes, garlic, cold-pressed olive oil, fresh basil.</text>

  <!-- Item 2 -->
  <text x="0" y="80" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Carpaccio di Manzo con Tartufo</text>
  <text x="475" y="80" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$19.00</text>
  <text x="0" y="94" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Thinly sliced prime beef tenderloin, shaved black truffle, arugula, 24-mo Parmigiano.</text>

  <!-- Item 3 -->
  <text x="0" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Burrata Pugliese con Prosciutto di Parma</text>
  <text x="475" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$18.50</text>
