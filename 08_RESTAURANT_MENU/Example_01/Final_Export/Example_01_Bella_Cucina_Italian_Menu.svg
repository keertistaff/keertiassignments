  <text x="475" y="42" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$19.50</text>
  <text x="0" y="56" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">San Marzano D.O.P. tomatoes, Mozzarella di Bufala Campana, fresh basil, EVOO.</text>

  <!-- Item 2 -->
  <text x="0" y="80" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Diavola Calabrese</text>
  <text x="475" y="80" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$22.00</text>
  <text x="0" y="94" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Spicy Calabrian soppressata, fior di latte mozzarella, hot chili oil, oregano.</text>

  <!-- Item 3 -->
  <text x="0" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Tartufata con Funghi Porcini</text>
  <text x="475" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$25.50</text>
  <text x="0" y="132" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Truffle cream base, wild porcini mushrooms, taleggio cheese, fresh thyme.</text>
</g>

<!-- SECTION 4: DOLCI & VINI -->
<g transform="translate(60, 655)">
  <rect x="0" y="0" width="130" height="22" rx="4" fill="#4D7C0F"/>
  <text x="65" y="15" font-family="'Arial Black', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">DOLCI &amp; VINI</text>

  <!-- Item 1 -->
  <text x="0" y="42" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Tiramisù Tradizionale al Mascarpone</text>
  <text x="475" y="42" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$11.00</text>
  <!-- Item 2 -->
  <text x="0" y="66" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Panna Cotta alla Vaniglia del Madagascar</text>
  <text x="475" y="66" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$10.50</text>
</g>

<!-- Footer -->
<text x="297" y="775" font-family="'Times New Roman', serif" font-style="italic" font-size="11" fill="#4D7C0F" text-anchor="middle">
  Tutti i piatti sono preparati freschi ogni giorno. Buon Appetito!
</text>
</svg>
