  <text x="475" y="80" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$28.50</text>
  <text x="0" y="94" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Bronze-cut pasta, wild tiger prawns, Mediterranean clams, calamari, white wine chili sauce.</text>

  <!-- Item 3 -->
  <text x="0" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#1C1917">Ravioli di Zucca con Salvia e Burro</text>
  <text x="475" y="118" font-family="'Times New Roman', serif" font-weight="bold" font-size="13" fill="#991B1B" text-anchor="end">$22.00</text>
