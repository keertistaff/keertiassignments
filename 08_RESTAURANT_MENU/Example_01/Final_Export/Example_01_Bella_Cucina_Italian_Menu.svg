  <text x="0" y="56" font-family="'Times New Roman', serif" font-style="italic" font-size="10" fill="#666666">Handmade egg ribbon pasta, slow-simmered prime beef &amp; veal ragù, aged pecorino.</text>

  <!-- Item 2 -->
