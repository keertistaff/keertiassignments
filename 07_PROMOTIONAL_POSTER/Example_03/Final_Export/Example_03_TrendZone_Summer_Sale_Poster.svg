<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 1191" width="842" height="1191">
<defs>
  <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#F97316"/>
    <stop offset="50%" stop-color="#E11D48"/>
    <stop offset="100%" stop-color="#4A044E"/>
  </linearGradient>
</defs>

<rect width="842" height="1191" fill="url(#sunsetGrad)"/>

<!-- Poster Frame -->
<rect x="40" y="40" width="762" height="1111" fill="none" stroke="#FDE047" stroke-width="2"/>

<!-- Top Brand Lockup -->
<g transform="translate(80, 80)">
  <text x="0" y="32" font-family="'Arial Black', sans-serif" font-size="32" fill="#FFFFFF" letter-spacing="4">TRENDZONE</text>
  <text x="0" y="56" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" letter-spacing="8" fill="#FDE047">HAUTE COUTURE</text>
</g>
<text x="760" y="112" font-family="'Arial Black', sans-serif" font-size="20" letter-spacing="3" fill="#FFFFFF" text-anchor="end">LIMITED TIME EVENT</text>

<!-- Huge Editorial Typography Centerpiece -->
<g transform="translate(421, 300)" text-anchor="middle">
  <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="44" letter-spacing="12" fill="#FDE047">SUMMER '26</text>
  <text x="0" y="190" font-family="'Arial Black', sans-serif" font-size="220" letter-spacing="1" fill="#FFFFFF">SALE</text>
  <rect x="-240" y="240" width="480" height="70" rx="35" fill="#FDE047"/>
  <text x="0" y="288" font-family="'Arial Black', sans-serif" font-size="38" fill="#4A044E">UP TO 50% OFF</text>
</g>

<!-- Category Tags -->
<g transform="translate(80, 720)">
  <rect x="0" y="0" width="682" height="140" rx="16" fill="#2E0234" opacity="0.6"/>
  <text x="341" y="45" font-family="'Arial Black', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
