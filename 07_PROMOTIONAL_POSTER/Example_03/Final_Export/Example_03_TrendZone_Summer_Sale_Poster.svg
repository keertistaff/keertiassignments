    Free express shipping on all orders above $150
  </text>
  <text x="341" y="115" font-family="'Arial', sans-serif" font-size="13" fill="#D8B4E2" text-anchor="middle">
    Offer valid in-store &amp; online across all flagship boutiques
  </text>
</g>

<!-- Bottom Promo Code & Website -->
<g transform="translate(80, 940)">
  <rect x="0" y="0" width="682" height="110" rx="20" fill="#FFFFFF"/>
  <text x="50" y="48" font-family="'Arial Black', sans-serif" font-size="24" fill="#4A044E">USE CODE: SUN50</text>
  <text x="50" y="78" font-family="'Arial', sans-serif" font-size="14" fill="#6B7280">Unlock an extra 10% instant rebate at checkout</text>

  <rect x="460" y="25" width="180" height="60" rx="30" fill="#F97316"/>
  <text x="550" y="62" font-family="'Arial Black', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">SHOP NOW</text>
