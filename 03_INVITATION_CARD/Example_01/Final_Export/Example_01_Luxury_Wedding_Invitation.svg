<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504" width="360" height="504">
<defs>
  <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F5DE9E"/>
    <stop offset="35%" stop-color="#D4AF37"/>
    <stop offset="70%" stop-color="#AA7A1E"/>
    <stop offset="100%" stop-color="#E5C775"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="360" height="504" fill="#FCFBF7"/>

<!-- Double Ornate Border -->
<rect x="16" y="16" width="328" height="472" fill="none" stroke="url(#goldFoil)" stroke-width="1.5"/>
<rect x="22" y="22" width="316" height="460" fill="none" stroke="url(#goldFoil)" stroke-width="0.75" stroke-dasharray="6 3"/>

<!-- Corner Flourishes -->
<g stroke="url(#goldFoil)" stroke-width="1.2" fill="none">
  <!-- Top Left -->
  <path d="M 22,46 C 36,46 46,36 46,22"/>
  <circle cx="38" cy="38" r="3" fill="url(#goldFoil)"/>
  <!-- Top Right -->
  <path d="M 338,46 C 324,46 314,36 314,22"/>
  <circle cx="322" cy="38" r="3" fill="url(#goldFoil)"/>
  <!-- Bottom Left -->
  <path d="M 22,458 C 36,458 46,468 46,482"/>
  <circle cx="38" cy="466" r="3" fill="url(#goldFoil)"/>
  <!-- Bottom Right -->
  <path d="M 338,458 C 324,458 314,468 314,482"/>
  <circle cx="322" cy="466" r="3" fill="url(#goldFoil)"/>
</g>

<!-- Top Monogram Crest -->
<g transform="translate(180, 72)">
  <circle cx="0" cy="0" r="26" fill="none" stroke="url(#goldFoil)" stroke-width="1.5"/>
  <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldFoil)" stroke-width="0.5"/>
  <text x="0" y="7" fill="url(#goldFoil)" font-family="'Times New Roman', serif" font-size="19" font-style="italic" font-weight="bold" text-anchor="middle">A &amp; V</text>
</g>

<!-- Invitation Text -->
<text x="180" y="128" fill="#8B6B23" font-family="'Times New Roman', Georgia, serif" font-size="11" letter-spacing="4" text-anchor="middle">TOGETHER WITH THEIR FAMILIES</text>
<text x="180" y="152" fill="#2C2825" font-family="'Times New Roman', Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">request the pleasure of your company</text>
<text x="180" y="172" fill="#2C2825" font-family="'Times New Roman', Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">at the celebration of their wedding</text>

<!-- Couple Names -->
<text x="180" y="222" fill="url(#goldFoil)" font-family="'Times New Roman', serif" font-size="30" letter-spacing="2" text-anchor="middle">ALEXANDER</text>
<text x="180" y="254" fill="#8B6B23" font-family="'Times New Roman', serif" font-size="20" font-style="italic" text-anchor="middle">&amp;</text>
<text x="180" y="292" fill="url(#goldFoil)" font-family="'Times New Roman', serif" font-size="30" letter-spacing="2" text-anchor="middle">VICTORIA</text>

<!-- Floral Divider -->
<g transform="translate(180, 318)" stroke="url(#goldFoil)" stroke-width="1" fill="none">
  <line x1="-60" y1="0" x2="-10" y2="0"/>
  <circle cx="0" cy="0" r="3" fill="url(#goldFoil)"/>
  <line x1="10" y1="0" x2="60" y2="0"/>
</g>

<!-- Date & Time -->
<text x="180" y="348" fill="#2C2825" font-family="'Times New Roman', serif" font-size="12" letter-spacing="3" text-anchor="middle">SATURDAY, SEPTEMBER 26, 2026</text>
<text x="180" y="368" fill="#8B6B23" font-family="'Times New Roman', serif" font-size="11" letter-spacing="2" text-anchor="middle">AT FIVE O'CLOCK IN THE EVENING</text>

<!-- Venue -->
<text x="180" y="406" fill="#2C2825" font-family="'Times New Roman', serif" font-weight="bold" font-size="12" letter-spacing="2" text-anchor="middle">THE GRAND BELVEDERE PALACE</text>
<text x="180" y="424" fill="#666666" font-family="'Times New Roman', serif" font-size="11" letter-spacing="1" text-anchor="middle">100 KENSINGTON GARDENS, LONDON</text>

<!-- RSVP -->
<text x="180" y="462" fill="#8B6B23" font-family="'Times New Roman', serif" font-size="10" letter-spacing="3" text-anchor="middle">RECEPTION TO FOLLOW  |  RSVP BY AUG 15</text>
</svg>
