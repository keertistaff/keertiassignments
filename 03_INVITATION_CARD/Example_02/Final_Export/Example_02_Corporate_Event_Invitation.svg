<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504" width="360" height="504">
<defs>
  <linearGradient id="corpNavy" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#071120"/>
    <stop offset="60%" stop-color="#0A192F"/>
    <stop offset="100%" stop-color="#112240"/>
  </linearGradient>
  <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#F5DE9E"/>
    <stop offset="100%" stop-color="#D4AF37"/>
  </linearGradient>
</defs>

<rect width="360" height="504" fill="url(#corpNavy)"/>

<!-- Grid Accents -->
<g stroke="#38BDF8" stroke-width="0.5" opacity="0.1" fill="none">
  <line x1="0" y1="80" x2="360" y2="80"/>
  <line x1="0" y1="160" x2="360" y2="160"/>
  <line x1="0" y1="360" x2="360" y2="360"/>
  <line x1="0" y1="440" x2="360" y2="440"/>
</g>

<!-- Gold Frame -->
<rect x="20" y="20" width="320" height="464" fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>

<!-- VIP Ribbon Badge -->
<g transform="translate(180, 52)">
  <rect x="-65" y="0" width="130" height="22" rx="11" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1"/>
  <text x="0" y="15" fill="#38BDF8" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" letter-spacing="3" text-anchor="middle">OFFICIAL VIP INVITATION</text>
</g>

<!-- Summit Title -->
<text x="180" y="112" fill="url(#goldAccent)" font-family="'Arial', sans-serif" font-weight="bold" font-size="13" letter-spacing="4" text-anchor="middle">APEX GLOBAL LEADERSHIP</text>
<text x="180" y="146" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="28" letter-spacing="2" text-anchor="middle">SUMMIT 2026</text>
<text x="180" y="170" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="11" letter-spacing="1" text-anchor="middle">INNOVATION  •  SUSTAINABILITY  •  CAPITAL</text>

<!-- Divider -->
<line x1="120" y1="190" x2="240" y2="190" stroke="url(#goldAccent)" stroke-width="1"/>

<!-- Text Invitation -->
<text x="180" y="222" fill="#E2E8F0" font-family="'Arial', sans-serif" font-size="12" text-anchor="middle">Cordially invites you to join international CEOs,</text>
<text x="180" y="240" fill="#E2E8F0" font-family="'Arial', sans-serif" font-size="12" text-anchor="middle">investors, and tech pioneers for an exclusive evening</text>
<text x="180" y="258" fill="#E2E8F0" font-family="'Arial', sans-serif" font-size="12" text-anchor="middle">of keynote vision and networking dinner.</text>

<!-- Event Details Card -->
<g transform="translate(45, 285)">
  <rect x="0" y="0" width="270" height="96" rx="10" fill="#112240" stroke="#233554" stroke-width="1"/>
  <text x="135" y="28" fill="url(#goldAccent)" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" letter-spacing="1" text-anchor="middle">THURSDAY, NOVEMBER 12, 2026</text>
  <text x="135" y="48" fill="#FFFFFF" font-family="'Arial', sans-serif" font-size="11" text-anchor="middle">6:30 PM RECEPTION  |  7:30 PM GALA DINNER</text>
  <text x="135" y="74" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="10" text-anchor="middle">METROPOLITAN SYMPOSIUM HALL, NEW YORK</text>
</g>

<!-- Keynote Note -->
<text x="180" y="415" fill="#38BDF8" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" letter-spacing="1" text-anchor="middle">KEYNOTE SPEAKER: ELENA ROSTOVA (CTO, NEXUS)</text>
<text x="180" y="445" fill="#64748B" font-family="'Arial', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">BLACK TIE REQUIRED  |  RSVP: SUMMIT.APEX.COM</text>
</svg>
