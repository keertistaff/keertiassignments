<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504" width="360" height="504">
<defs>
  <radialGradient id="partyGlow" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#4C1D95"/>
    <stop offset="50%" stop-color="#2E1065"/>
    <stop offset="100%" stop-color="#0F031E"/>
  </radialGradient>
</defs>

<rect width="360" height="504" fill="url(#partyGlow)"/>

<!-- Confetti Bursts -->
<g fill="#FFD000" opacity="0.7">
  <circle cx="40" cy="50" r="4"/><circle cx="320" cy="80" r="5"/><circle cx="80" cy="180" r="3"/>
  <circle cx="300" cy="220" r="4"/><circle cx="50" cy="420" r="5"/><circle cx="310" cy="440" r="3"/>
</g>
<g fill="#FF2E93" opacity="0.7">
  <polygon points="50,90 56,102 44,102"/><polygon points="280,60 288,72 272,72"/>
  <polygon points="40,320 48,332 32,332"/><polygon points="320,340 326,352 314,352"/>
</g>
<g fill="#00F0FF" opacity="0.6">
  <rect x="70" y="80" width="6" height="6" transform="rotate(45 73 83)"/>
  <rect x="290" y="140" width="8" height="8" transform="rotate(25 294 144)"/>
  <rect x="70" y="440" width="6" height="6" transform="rotate(15 73 443)"/>
</g>

<!-- Content -->
<text x="180" y="70" fill="#00F0FF" font-family="'Arial Black', sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">YOU'RE INVITED TO CELEBRATE</text>

<!-- Big Age Badge -->
<g transform="translate(180, 140)">
  <circle cx="0" cy="0" r="46" fill="#FF2E93"/>
  <circle cx="0" cy="0" r="40" fill="none" stroke="#FFD000" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="0" y="16" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="44" text-anchor="middle">25</text>
</g>

<!-- Name & Headline -->
<text x="180" y="222" fill="#FFD000" font-family="'Arial Black', sans-serif" font-size="28" letter-spacing="2" text-anchor="middle">LIAM'S BIRTHDAY</text>
<text x="180" y="256" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="22" letter-spacing="1" text-anchor="middle">NEON RETRO BASH</text>

<!-- Party Info Pill -->
<g transform="translate(50, 280)">
  <rect x="0" y="0" width="260" height="96" rx="16" fill="#1E0538" stroke="#FF2E93" stroke-width="2"/>
  <text x="130" y="28" fill="#00F0FF" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" letter-spacing="2" text-anchor="middle">SATURDAY, AUGUST 15</text>
  <text x="130" y="48" fill="#FFD000" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">DOORS OPEN AT 8:00 PM</text>
  <text x="130" y="74" fill="#FFFFFF" font-family="'Arial', sans-serif" font-size="11" text-anchor="middle">THE NEON LOUNGE • DOWNTOWN ROOFTOP</text>
</g>

<!-- Party Highlights -->
<text x="180" y="412" fill="#E2E8F0" font-family="'Arial', sans-serif" font-size="11" letter-spacing="1" text-anchor="middle">LIVE DJ SET  •  OPEN COCKTAIL BAR  •  TACO BAR</text>
<text x="180" y="432" fill="#FF2E93" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" letter-spacing="2" text-anchor="middle">DRESS CODE: 80s / 90s RETRO GLAM</text>

<text x="180" y="468" fill="#94A3B8" font-family="'Arial', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">RSVP TO SARAH BY AUGUST 1ST</text>
</svg>
