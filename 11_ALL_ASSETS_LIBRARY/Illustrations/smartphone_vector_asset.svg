<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 860" width="460" height="860">
  <defs>
    <linearGradient id="titanFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="45%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="oledScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041538"/>
      <stop offset="45%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>
  <!-- Phone Outer Titanium Chassis -->
  <rect x="20" y="20" width="420" height="820" rx="54" fill="url(#titanFrame)" stroke="#00D4FF" stroke-width="3"/>
  <!-- Inner Black Bezel -->
  <rect x="32" y="32" width="396" height="796" rx="44" fill="#050811"/>
  <!-- OLED Screen -->
  <rect x="44" y="44" width="372" height="772" rx="36" fill="url(#oledScreen)"/>
  <!-- Glowing Abstract Display Waves -->
  <path d="M44,520 C140,420 260,600 416,450 L416,816 L44,816 Z" fill="#031029" opacity="0.72"/>
  <path d="M44,610 C180,500 280,680 416,540" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <circle cx="230" cy="360" r="110" fill="#00F0FF" opacity="0.18"/>
  <circle cx="230" cy="360" r="65" fill="#FFFFFF" opacity="0.14"/>
  <!-- Dynamic Pill -->
  <rect x="172" y="64" width="116" height="26" rx="13" fill="#050811"/>
  <circle cx="256" cy="77" r="6" fill="#00D4FF" opacity="0.6"/>
  <!-- Glass Reflection -->
  <polygon points="44,44 260,44 110,816 44,816" fill="#FFFFFF" opacity="0.06"/>
</svg>
