<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs>
  <radialGradient id="pizzaGlow" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#27272A"/>
    <stop offset="100%" stop-color="#09090B"/>
  </radialGradient>
  <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#EF4444"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>
</defs>

<rect width="1080" height="1080" fill="url(#pizzaGlow)"/>

<!-- Geometric Frame Border -->
<rect x="50" y="50" width="980" height="980" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="16 8" opacity="0.3"/>

<!-- Top Brand Lockup -->
<g transform="translate(100, 100)">
  <rect x="0" y="0" width="220" height="48" rx="24" fill="#DC2626"/>
  <text x="110" y="32" font-family="'Arial Black', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">URBAN BITES</text>
</g>
<text x="980" y="132" font-family="'Arial', sans-serif" font-weight="bold" font-size="18" letter-spacing="3" fill="#F59E0B" text-anchor="end">WEEKEND SPECIAL</text>

<!-- Bold Headline -->
<g transform="translate(100, 220)">
  <text x="0" y="60" font-family="'Arial Black', sans-serif" font-size="76" fill="#FFFFFF" letter-spacing="1">WOOD-FIRED</text>
  <text x="0" y="145" font-family="'Arial Black', sans-serif" font-size="88" fill="url(#fireGrad)" letter-spacing="2">ARTISAN PIZZA</text>
  <text x="0" y="195" font-family="'Arial', sans-serif" font-size="22" fill="#D4D4D8">Hand-stretched dough • San Marzano tomatoes • Fresh burrata</text>
</g>

<!-- Central Vector Pizza Wheel Graphic -->
<g transform="translate(540, 620)">
  <!-- Glow Behind Pizza -->
  <circle cx="0" cy="0" r="260" fill="#F59E0B" opacity="0.12"/>
  <!-- Crust -->
  <circle cx="0" cy="0" r="230" fill="#D97706" stroke="#92400E" stroke-width="8"/>
  <!-- Sauce -->
  <circle cx="0" cy="0" r="205" fill="#DC2626"/>
  <!-- Melted Cheese -->
  <circle cx="0" cy="0" r="185" fill="#FDE68A"/>

  <!-- Pepperoni Slices -->
  <circle cx="-60" cy="-70" r="32" fill="#B91C1C"/><circle cx="-50" cy="-60" r="26" fill="#991B1B"/>
  <circle cx="70" cy="-80" r="32" fill="#B91C1C"/><circle cx="80" cy="-70" r="26" fill="#991B1B"/>
  <circle cx="-90" cy="40" r="32" fill="#B91C1C"/><circle cx="-80" cy="50" r="26" fill="#991B1B"/>
  <circle cx="60" cy="50" r="32" fill="#B91C1C"/><circle cx="70" cy="60" r="26" fill="#991B1B"/>
  <circle cx="0" cy="-10" r="36" fill="#B91C1C"/><circle cx="8" cy="-2" r="30" fill="#991B1B"/>
  <circle cx="-20" cy="110" r="30" fill="#B91C1C"/>

  <!-- Basil Leaves -->
  <g fill="#16A34A">
    <ellipse cx="-20" cy="-80" rx="16" ry="8" transform="rotate(-30 -20 -80)"/>
    <ellipse cx="90" cy="-10" rx="16" ry="8" transform="rotate(40 90 -10)"/>
    <ellipse cx="-30" cy="40" rx="16" ry="8" transform="rotate(20 -30 40)"/>
    <ellipse cx="40" cy="110" rx="16" ry="8" transform="rotate(-45 40 110)"/>
  </g>
</g>

<!-- Big Discount Badge (Top Right of Pizza) -->
<g transform="translate(860, 480)">
  <circle cx="0" cy="0" r="90" fill="#DC2626" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="0" cy="0" r="80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="38" fill="#FFFFFF" text-anchor="middle">50%</text>
  <text x="0" y="32" font-family="'Arial Black', sans-serif" font-size="28" fill="#FDE68A" text-anchor="middle">OFF</text>
  <text x="0" y="54" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">2ND PIZZA</text>
</g>

<!-- Bottom CTA & Location -->
<g transform="translate(100, 910)">
  <rect x="0" y="0" width="340" height="76" rx="38" fill="url(#fireGrad)"/>
  <text x="170" y="47" font-family="'Arial Black', sans-serif" font-size="22" fill="#09090B" letter-spacing="2" text-anchor="middle">ORDER ONLINE NOW</text>
</g>

<g transform="translate(980, 930)" text-anchor="end">
  <text x="0" y="20" font-family="'Arial Black', sans-serif" font-size="22" fill="#FFFFFF">WWW.URBANBITES.COM</text>
  <text x="0" y="45" font-family="'Arial', sans-serif" font-size="16" fill="#A1A1AA">Dine-in • Takeaway • Contactless Delivery</text>
</g>
</svg>
