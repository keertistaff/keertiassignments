    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="50%" stop-color="#EC4899"/>
    <stop offset="100%" stop-color="#F97316"/>
  </linearGradient>
</defs>

<rect width="800" height="500" fill="#F4F4F5"/>
<text x="400" y="45" font-family="'Arial Black', sans-serif" font-size="18" fill="#18181B" text-anchor="middle">PIXELCRAFT STUDIO - CREATIVE DESIGNER CARD (3.5" x 2")</text>

<!-- Front Card -->
