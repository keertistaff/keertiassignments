  </g>
  <text x="170" y="145" font-family="'Arial Black', sans-serif" font-size="20" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">PIXELCRAFT</text>
  <text x="170" y="165" font-family="'Arial', sans-serif" font-weight="bold" font-size="9" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">STUDIO • BROOKLYN</text>
  <text x="170" y="235" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" fill="#71717A" text-anchor="middle">FRONT (HOLOGRAPHIC FOIL)</text>
</g>

<!-- Back Card -->
<g transform="translate(415, 90)">
