    <text x="0" y="18">P: +1 (212) 555-0144</text>
    <text x="0" y="36">W: www.pixelcraft.studio</text>
    <text x="0" y="54">IG: @pixelcraft_studio</text>
  </g>

  <text x="310" y="170" font-family="'Arial Black', sans-serif" font-size="16" fill="url(#holoGrad)" text-anchor="end">DESIGN THAT MOVES.</text>
  <text x="170" y="235" font-family="'Arial', sans-serif" font-weight="bold" font-size="12" fill="#71717A" text-anchor="middle">BACK (MATTE VELVET FINISH)</text>
